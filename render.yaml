services:
  - type: web
    name: glassbox-alpha-agent
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BROKER_MODE
        value: alpaca
      - key: EXECUTION_MODE
        value: paper
      - key: UNDERLYINGS
        value: SPY,QQQ
      - key: ADDITIONAL_UNDERLYINGS
        value: GLD,IWM
      - key: VALIDATED_UNIVERSE_EXPANSION
        value: DIA,TLT,XLF,SMH
      - key: RISK_PER_TRADE_PCT
        value: "0.0025"
      - key: MAX_OPTION_EXPOSURE_PCT
        value: "0.01"
      - key: MAX_TRADES_PER_DAY
        value: "8"
      - key: MAX_OPTION_POSITIONS
        value: "3"
      - key: MAX_HOLD_MINUTES
        value: "75"
      - key: PROFIT_TARGET_PCT
        value: "0.25"
      - key: STOP_LOSS_PCT
        value: "0.18"
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      - key: COMPETITION_ACCOUNT_ID
        sync: false
      - key: COMPETITION_START_UTC
        value: 2026-08-28T15:00:00+00:00
      - key: ALPACA_EXECUTION_BACKEND
        value: cli
      - key: ALPACA_CLI_PATH
        value: /usr/local/bin/alpaca
      - key: ALPACA_LIVE_TRADE
        value: "false"
      - key: OPTION_FEED
        value: indicative
      - key: USE_DEEPSEEK
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-v4-flash
      - key: ALLOW_PAPER_ORDERS
        value: "true"
      - key: PAPER_ORDER_CONFIRMATION
        value: I_UNDERSTAND_PAPER_ONLY
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/glassbox_alpha.sqlite3
      - key: KILL_SWITCH_PATH
        value: /tmp/KILL_SWITCH
