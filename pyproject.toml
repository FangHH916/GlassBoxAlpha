[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-alpha"
version = "0.1.0"
description = "An auditable, paper-only AI options trading agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alpaca-py>=0.44,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
glassbox-alpha = "glassbox_alpha.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
